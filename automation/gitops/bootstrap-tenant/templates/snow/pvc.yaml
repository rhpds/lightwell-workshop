{{- /*
  Somewhere for snow-mock to keep its incidents.

  Without this the incident table is pure process memory: a pod restart
  re-issues the seeded numbers, and any comment or finalize AO sends for an
  incident created before the restart fails with "Incident not found". That
  is what broke the ticket lifecycle on cd2fp — AO resumed executions from
  before a restart and asked for INC0023255 when the mock had been rewound
  to INC0023250.
*/ -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: snow-mock-state
  namespace: snow-{{ .Values.guid }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ ((.Values.snow | default dict).stateStorage) | default "1Gi" | quote }}
{{- if .Values.deployer.storageClass }}
  storageClassName: {{ .Values.deployer.storageClass | quote }}
{{- end }}
