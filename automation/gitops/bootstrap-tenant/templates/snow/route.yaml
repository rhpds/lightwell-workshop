apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: snow-mock
  namespace: {{ include "bootstrap-tenant.snowNamespace" . }}
  labels:
    app: snow-mock
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  to:
    kind: Service
    name: snow-mock
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
