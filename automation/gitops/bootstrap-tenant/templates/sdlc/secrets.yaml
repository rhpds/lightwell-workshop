{{- if .Values.sdlc.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: opencode-server
  namespace: {{ include "bootstrap-tenant.sdlcNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
type: Opaque
stringData:
  password: {{ include "bootstrap-tenant.opencodeServerPassword" . | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-credentials
  namespace: {{ include "bootstrap-tenant.sdlcNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
type: Opaque
stringData:
  url: {{ include "bootstrap-tenant.gitlabHost" . | quote }}
  username: {{ .Values.username | quote }}
  password: {{ .Values.password | quote }}
  {{- if .Values.gitlab.pat }}
  token: {{ .Values.gitlab.pat | quote }}
  {{- end }}
{{- if and .Values.sdlc.llm.apiKey (not .Values.sdlc.llm.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: opencode-llm
  namespace: {{ include "bootstrap-tenant.sdlcNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
type: Opaque
stringData:
  api_key: {{ .Values.sdlc.llm.apiKey | quote }}
{{- end }}
{{- end }}
