{{- if and .Values.sdlc.enabled .Values.sdlc.dashboard.enabled }}
# Nexus owns the upstream credentials. Copy them into this tenant's dashboard
# namespace so the UI can list upstream Maven metadata without fetching jars.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dashboard-lightwell-reader-{{ .Values.guid }}
  namespace: {{ include "bootstrap-tenant.nexusNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "bootstrap-tenant.lightwellNetworkSecretName" . | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-lightwell-reader-{{ .Values.guid }}
  namespace: {{ include "bootstrap-tenant.nexusNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dashboard-lightwell-reader-{{ .Values.guid }}
subjects:
  - kind: ServiceAccount
    name: lightwell-tenant-jobs
    namespace: {{ include "bootstrap-tenant.jobNamespace" . }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sync-dashboard-lightwell-credentials
  namespace: {{ include "bootstrap-tenant.jobNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 8
  template:
    spec:
      serviceAccountName: lightwell-tenant-jobs
      restartPolicy: OnFailure
      containers:
        - name: sync-dashboard-lightwell-credentials
          image: {{ .Values.jobAnsibleImage | quote }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              NEXUS_NS="{{ include "bootstrap-tenant.nexusNamespace" . }}"
              SDLC_NS="{{ include "bootstrap-tenant.sdlcNamespace" . }}"
              SOURCE_SECRET="{{ include "bootstrap-tenant.lightwellNetworkSecretName" . }}"
              USER_B64=""
              PASS_B64=""
              # Short wait only: credentials arrive when a human runs
              # inject-env-secrets.sh, which re-syncs the Application and
              # re-runs this hook. Waiting longer here just delays waves 4-5.
              for i in $(seq 1 12); do
                USER_B64=$(oc get secret "${SOURCE_SECRET}" -n "${NEXUS_NS}" -o jsonpath='{.data.username}' 2>/dev/null || true)
                PASS_B64=$(oc get secret "${SOURCE_SECRET}" -n "${NEXUS_NS}" -o jsonpath='{.data.password}' 2>/dev/null || true)
                if [ -n "${USER_B64}" ] && [ -n "${PASS_B64}" ]; then break; fi
                echo "Waiting for Lightwell Network credentials (${i}/12)..."
                sleep 5
              done
              # Degrade rather than fail. This is a Sync hook at wave 3: exiting
              # non-zero blocks waves 4-5 (eda-bootstrap, nexus-reconcile) and
              # sinks the whole tenant over an optional dashboard panel.
              if [ -z "${USER_B64}" ] || [ -z "${PASS_B64}" ]; then
                echo "DEGRADED: secret/${NEXUS_NS}/${SOURCE_SECRET} has no credentials."
                echo "Dashboard will start without Lightwell upstream metadata."
                echo "Populate the Secret and re-sync to create dashboard-lightwell-network."
                exit 0
              fi
              CURRENT_USER=$(oc get secret dashboard-lightwell-network -n "${SDLC_NS}" -o jsonpath='{.data.username}' 2>/dev/null || true)
              CURRENT_PASS=$(oc get secret dashboard-lightwell-network -n "${SDLC_NS}" -o jsonpath='{.data.password}' 2>/dev/null || true)
              if [ "${CURRENT_USER}" = "${USER_B64}" ] && [ "${CURRENT_PASS}" = "${PASS_B64}" ]; then
                echo "dashboard-lightwell-network already current in ${SDLC_NS}"
                exit 0
              fi
              USER_RAW=$(printf '%s' "${USER_B64}" | base64 -d)
              PASS_RAW=$(printf '%s' "${PASS_B64}" | base64 -d)
              oc create secret generic dashboard-lightwell-network -n "${SDLC_NS}" \
                --from-literal=username="${USER_RAW}" \
                --from-literal=password="${PASS_RAW}" \
                --dry-run=client -o yaml | oc apply -f -
              echo "dashboard-lightwell-network updated in ${SDLC_NS}"
              if oc get deploy demo-dashboard -n "${SDLC_NS}" >/dev/null 2>&1; then
                oc rollout restart deploy/demo-dashboard -n "${SDLC_NS}"
              fi
{{- end }}
