{{- if .Values.sdlc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: {{ include "bootstrap-tenant.sdlcNamespace" . }}
  labels:
    app: opencode
    lightwell.guid: {{ .Values.guid | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opencode
  template:
    metadata:
      labels:
        app: opencode
    spec:
      securityContext:
        runAsNonRoot: true
      volumes:
        - name: tmp-home
          emptyDir: {}
      containers:
        - name: opencode
          image: {{ .Values.sdlc.opencodeImage | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: /tmp
            - name: XDG_DATA_HOME
              value: /tmp
            - name: OPENCODE_SERVER_USERNAME
              value: {{ .Values.sdlc.opencodeServerUsername | quote }}
            - name: OPENCODE_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencode-server
                  key: password
            - name: GITLAB_URL
              valueFrom:
                secretKeyRef:
                  name: gitlab-credentials
                  key: url
            - name: GITLAB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitlab-credentials
                  key: password
            - name: GITLAB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gitlab-credentials
                  key: username
            - name: GITLAB_PAT
              valueFrom:
                secretKeyRef:
                  name: gitlab-credentials
                  key: token
                  optional: true
            {{- if .Values.sdlc.llm.apiKey }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opencode-llm
                  key: api_key
            {{- end }}
          volumeMounts:
            - name: tmp-home
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 4096
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: opencode
  namespace: {{ include "bootstrap-tenant.sdlcNamespace" . }}
  labels:
    app: opencode
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    app: opencode
  ports:
    - name: http
      port: 4096
      targetPort: http
{{- end }}
