{{- if .Values.tpa.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tpa-{{ .Values.guid }}
  namespace: {{ .Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/part-of: tpa
spec:
  project: default
  source:
    repoURL: https://charts.openshift.io/
    chart: redhat-trusted-profile-analyzer
    targetRevision: {{ .Values.tpa.chartVersion | quote }}
    helm:
      valuesObject:
        openshift:
          enabled: true
        appDomain: -tpa-{{ .Values.guid }}.{{ .Values.deployer.domain }}
        ingress:
          className: openshift-default
          additionalAnnotations:
            haproxy.router.openshift.io/timeout: "5m"
        storage:
          type: s3
          region: https://s3-openshift-storage.{{ .Values.deployer.domain }}:443
          bucket: tpa-{{ .Values.guid }}-bucket
          accessKey:
            valueFrom:
              secretKeyRef:
                name: {{ .Values.tpa.objectBucketClaim.name }}
                key: AWS_ACCESS_KEY_ID
          secretKey:
            valueFrom:
              secretKeyRef:
                name: {{ .Values.tpa.objectBucketClaim.name }}
                key: AWS_SECRET_ACCESS_KEY
        database:
          host:
            valueFrom:
              secretKeyRef:
                name: tpa-postgresql-credentials
                key: db.host
          port:
            valueFrom:
              secretKeyRef:
                name: tpa-postgresql-credentials
                key: db.port
          name:
            valueFrom:
              secretKeyRef:
                name: tpa-postgresql-credentials
                key: db.name
          username:
            valueFrom:
              secretKeyRef:
                name: tpa-postgresql-credentials
                key: db.user
          password:
            valueFrom:
              secretKeyRef:
                name: tpa-postgresql-credentials
                key: db.password
        createDatabase:
          name:
            valueFrom:
              secretKeyRef:
                name: tpa-postgresql-credentials
                key: db.name
          username:
            valueFrom:
              secretKeyRef:
                name: tpa-postgresql-credentials
                key: db.admin
          password:
            valueFrom:
              secretKeyRef:
                name: tpa-postgresql-credentials
                key: db.adminpassword
        migrateDatabase:
          username:
            valueFrom:
              secretKeyRef:
                name: tpa-postgresql-credentials
                key: db.admin
          password:
            valueFrom:
              secretKeyRef:
                name: tpa-postgresql-credentials
                key: db.adminpassword
        modules:
          server:
            enabled: true
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
          importer:
            enabled: true
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi
            workingDirectory:
              size: 2Gi
          createDatabase:
            enabled: true
          migrateDatabase:
            enabled: true
          createImporters:
            enabled: true
            importers:
              redhat-sboms:
                sbom:
                  description: All Red Hat SBOMs
                  period: 1d
                  source: https://access.redhat.com/security/data/sbom/beta/
                  keys:
                    - https://access.redhat.com/security/data/97f5eac4.txt#77E79ABE93673533ED09EBE2DCE3823597F5EAC4
                  disabled: true
                  fetchRetries: 50
              redhat-csaf:
                csaf:
                  description: All Red Hat CSAF data
                  period: 1d
                  source: redhat.com
                  disabled: true
                  fetchRetries: 50
              cve:
                cve:
                  description: CVE list v5
                  period: 1d
                  source: https://github.com/CVEProject/cvelistV5
                  disabled: true
              osv-github:
                osv:
                  transport: git
                  description: GitHub Advisory Database
                  period: 1d
                  source: https://github.com/github/advisory-database
                  path: advisories
                  disabled: true
        oidc:
          issuerUrl: https://{{ include "tpa.keycloakHost" . }}/realms/{{ .Values.keycloak.realm }}
          clients:
            frontend:
              clientId: {{ .Values.tpa.oidc.frontendClientId }}
            cli:
              clientId: {{ .Values.tpa.oidc.cliClientId }}
              clientSecret:
                valueFrom:
                  secretKeyRef:
                    name: oidc-cli
                    key: client-secret
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ include "tpa.namespace" . }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
