{{- if .Values.apps.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: acme-apps-{{ .Values.guid }}
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    lightwell.guid: {{ .Values.guid | quote }}
spec:
  project: acme-{{ .Values.guid }}
  source:
    repoURL: {{ include "bootstrap-tenant.gitlabUrl" . }}/{{ include "bootstrap-tenant.gitlabGroup" . }}/acme-deployment.git
    targetRevision: main
    path: .
    helm:
      valuesObject:
        guid: {{ .Values.guid }}
        domain: {{ .Values.deployer.domain }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.username }}-app
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=false
{{- end }}
