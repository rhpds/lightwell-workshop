{{- if .Values.apps.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-rbac-patcher-{{ .Values.guid }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["argocds"]
    resourceNames: ["openshift-gitops"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-rbac-patcher-{{ .Values.guid }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-rbac-patcher-{{ .Values.guid }}
subjects:
  - kind: ServiceAccount
    name: lightwell-tenant-jobs
    namespace: {{ include "bootstrap-tenant.jobNamespace" . }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: argocd-rbac-{{ .Values.guid }}
  namespace: {{ include "bootstrap-tenant.jobNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      serviceAccountName: lightwell-tenant-jobs
      restartPolicy: OnFailure
      containers:
        - name: patch-rbac
          image: registry.redhat.io/openshift4/ose-cli:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              ROLE="role:acme-{{ .Values.guid }}"
              USERNAME="{{ .Values.username }}"
              PROJECT="acme-{{ .Values.guid }}"

              CURRENT=$(oc get argocd openshift-gitops -n openshift-gitops -o jsonpath='{.spec.rbac.policy}')

              if echo "${CURRENT}" | grep -qF "${USERNAME}, ${ROLE}"; then
                echo "RBAC policy for ${USERNAME} already exists"
                exit 0
              fi

              EXTRA=$(printf 'p, %s, applications, *, %s/*, allow\np, %s, projects, get, %s, allow\ng, %s, %s' \
                "${ROLE}" "${PROJECT}" "${ROLE}" "${PROJECT}" "${USERNAME}" "${ROLE}")

              NEW_POLICY=$(printf '%s\n%s' "${CURRENT}" "${EXTRA}")

              python3 -c "
              import json, subprocess, sys
              policy = sys.stdin.read()
              patch = json.dumps({'spec': {'rbac': {'policy': policy}}})
              subprocess.check_call(['oc', 'patch', 'argocd', 'openshift-gitops',
                '-n', 'openshift-gitops', '--type', 'merge', '-p', patch])
              " <<< "${NEW_POLICY}"

              echo "Added ArgoCD RBAC role ${ROLE} for ${USERNAME}"
{{- end }}
