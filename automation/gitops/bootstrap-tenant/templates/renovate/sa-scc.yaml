{{- if .Values.sdlc.renovate.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: renovate-runner
  namespace: {{ include "bootstrap-tenant.sdlcNamespace" . }}
  labels:
    app: renovate
    lightwell.guid: {{ .Values.guid | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: renovate-runner-nonroot-v2-{{ .Values.guid }}
  labels:
    app: renovate
    lightwell.guid: {{ .Values.guid | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:nonroot-v2
subjects:
- kind: ServiceAccount
  name: renovate-runner
  namespace: {{ include "bootstrap-tenant.sdlcNamespace" . }}
{{- end }}
