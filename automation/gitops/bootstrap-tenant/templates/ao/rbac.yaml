{{- if and .Values.sdlc.enabled (eq (include "bootstrap-tenant.orchestratorEnabled" . | toString) "true") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lightwell-tenant-ao-reader-{{ .Values.guid }}
  namespace: {{ .Values.sdlc.orchestrator.namespace | default "automation-orchestrator" }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ao-admin-password"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lightwell-tenant-ao-reader-{{ .Values.guid }}
  namespace: {{ .Values.sdlc.orchestrator.namespace | default "automation-orchestrator" }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lightwell-tenant-ao-reader-{{ .Values.guid }}
subjects:
  - kind: ServiceAccount
    name: lightwell-tenant-jobs
    namespace: {{ include "bootstrap-tenant.jobNamespace" . }}
---
# Allow the bootstrap Job to write the per-tenant AO SA secret in the tenant ns.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lightwell-tenant-ao-secret-writer-{{ .Values.guid }}
  namespace: {{ include "bootstrap-tenant.jobNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lightwell-tenant-ao-secret-writer-{{ .Values.guid }}
  namespace: {{ include "bootstrap-tenant.jobNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lightwell-tenant-ao-secret-writer-{{ .Values.guid }}
subjects:
  - kind: ServiceAccount
    name: lightwell-tenant-jobs
    namespace: {{ include "bootstrap-tenant.jobNamespace" . }}
{{- end }}
