{{- if and .Values.sdlc.enabled (eq (include "bootstrap-tenant.drive" .) "ao") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: eda-bootstrap
  namespace: {{ include "bootstrap-tenant.jobNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: lightwell-tenant-jobs
      restartPolicy: OnFailure
      initContainers:
        - name: copy-script
          image: busybox:1.36
          command: ["sh", "-c", "cp /source/bootstrap-aap-eda.py /work/bootstrap-aap-eda.py && chmod 755 /work/bootstrap-aap-eda.py"]
          volumeMounts:
            - name: scripts-source
              mountPath: /source
              readOnly: true
            - name: scripts-work
              mountPath: /work
      containers:
        - name: bootstrap
          image: {{ .Values.jobAnsibleImage }}
          command:
            - /bin/bash
            - -c
            - |
              set -e
              AAP_NS="{{ .Values.aap.namespace }}"
              echo "Waiting for AAP Gateway route..."
              for i in $(seq 1 120); do
                ROUTE_HOST=$(oc get route -n "${AAP_NS}" -l app.kubernetes.io/managed-by=aap-operator -o jsonpath='{.items[0].spec.host}' 2>/dev/null)
                if [ -n "${ROUTE_HOST}" ]; then export AAP_CONTROLLER_URL="https://${ROUTE_HOST}"; break; fi
                echo "  Attempt ${i}/120 — route not yet available (10s)..."
                sleep 10
              done
              if [ -z "${AAP_CONTROLLER_URL:-}" ]; then echo "ERROR: AAP gateway route not found"; exit 1; fi
              echo "AAP Gateway: ${AAP_CONTROLLER_URL}"
              export AAP_USERNAME=admin
              export AAP_PASSWORD=$(oc get secret aap-admin-password -n "${AAP_NS}" -o jsonpath='{.data.password}' | base64 -d)
              export TPA_UPLOADER_USERNAME="{{ .Values.username }}"
              export TPA_UPLOADER_PASSWORD="{{ .Values.password }}"
              export OPENCODE_SERVER_PASSWORD="{{ .Values.sdlc.opencodeServerPassword | default .Values.password }}"
              # Per-tenant TPA uses Keycloak client tpa-cli (client_credentials).
              export TPA_OAUTH_CLIENT_ID="{{ .Values.tpa.oidc.cliClientId | default "tpa-cli" }}"
              TPA_NS="{{ include "tpa.namespace" . }}"
              JOB_NS="{{ include "bootstrap-tenant.jobNamespace" . }}"
              # Prefer mirrored secret in the job NS; fall back to oidc-cli in tpa-{guid}.
              export TPA_OAUTH_CLIENT_SECRET=$(oc get secret tpa-oidc-cli -n "${JOB_NS}" -o jsonpath='{.data.client-secret}' 2>/dev/null | base64 -d || true)
              if [ -z "${TPA_OAUTH_CLIENT_SECRET:-}" ]; then
                export TPA_OAUTH_CLIENT_SECRET=$(oc get secret oidc-cli -n "${TPA_NS}" -o jsonpath='{.data.client-secret}' 2>/dev/null | base64 -d || true)
              fi
              if [ -z "${TPA_OAUTH_CLIENT_SECRET:-}" ]; then
                echo "WARNING: tpa oidc-cli secret missing — Query TPA will fail until present"
              fi
              {{- if and .Values.sdlc.orchestrator .Values.sdlc.orchestrator.existingSecret }}
              # Prefer Secret over ConfigMap for AO service-account credentials.
              if [ -n "${AO_CLIENT_ID_FROM_SECRET:-}" ]; then export AO_CLIENT_ID="${AO_CLIENT_ID_FROM_SECRET}"; fi
              if [ -n "${AO_CLIENT_SECRET_FROM_SECRET:-}" ]; then export AO_CLIENT_SECRET="${AO_CLIENT_SECRET_FROM_SECRET}"; fi
              {{- end }}
              GITLAB_NS="{{ .Values.gitlab.namespace }}"
              export GITLAB_TOKEN=$(oc get secret root-user-personal-token -n "${GITLAB_NS}" -o jsonpath='{.data.token}' 2>/dev/null | base64 -d || true)
              if [ -z "${GITLAB_TOKEN:-}" ]; then
                echo "WARNING: GitLab root PAT not found — policy lookup / merge JTs will fail until present"
              fi
              exec python3 /work/bootstrap-aap-eda.py
          envFrom:
            - configMapRef:
                name: tenant-integration
          env:
            {{- if and .Values.sdlc.orchestrator .Values.sdlc.orchestrator.existingSecret }}
            - name: AO_CLIENT_ID_FROM_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "bootstrap-tenant.aoSecretName" . }}
                  key: client_id
                  optional: true
            - name: AO_CLIENT_SECRET_FROM_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "bootstrap-tenant.aoSecretName" . }}
                  key: client_secret
                  optional: true
            {{- end }}
          volumeMounts:
            - name: scripts-work
              mountPath: /work
              readOnly: true
      volumes:
        - name: scripts-source
          configMap:
            name: eda-bootstrap-source
        - name: scripts-work
          emptyDir: {}
{{- end }}
