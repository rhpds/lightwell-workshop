{{- if .Values.sdlc.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-tpa-uploader
  namespace: {{ include "bootstrap-tenant.jobNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 5
  template:
    spec:
      serviceAccountName: lightwell-tenant-jobs
      restartPolicy: OnFailure
      containers:
        - name: seed-tpa
          image: {{ .Values.jobAnsibleImage }}
          envFrom:
            - configMapRef:
                name: tenant-integration
          env:
            - name: TPA_UPLOADER_PASSWORD
              value: {{ .Values.password | quote }}
            - name: TPA_TRUSTIFY_URL
              value: {{ include "bootstrap-tenant.tpaUrl" . | quote }}
            - name: TPA_SBOM_FILE
              value: /seed/demo-sbom.cyclonedx.json
          command:
            - /bin/bash
            - -c
            - |
              set -e
              # Cross-namespace secret via oc (Role in keycloak NS); envFrom secret not mounted cluster-wide.
              export KEYCLOAK_ADMIN_USER=$(oc get secret keycloak-initial-admin -n keycloak -o jsonpath='{.data.username}' | base64 -d)
              export KEYCLOAK_ADMIN_PASSWORD=$(oc get secret keycloak-initial-admin -n keycloak -o jsonpath='{.data.password}' | base64 -d)
              exec python3 /scripts/seed-tpa-keycloak.py
          volumeMounts:
            - name: demo-sbom
              mountPath: /seed
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: demo-sbom
          configMap:
            name: demo-sbom
        - name: scripts
          configMap:
            name: tpa-seed-source
            defaultMode: 0555
{{- end }}
