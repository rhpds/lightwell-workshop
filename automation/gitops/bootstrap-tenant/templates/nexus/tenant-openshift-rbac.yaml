# Lab user (Keycloak / htpasswd) can work in their Nexus namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.username }}-nexus-edit
  namespace: {{ include "bootstrap-tenant.nexusNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: {{ .Values.username }}
