apiVersion: v1
kind: Secret
metadata:
  name: nexus-admin-secret
  namespace: {{ include "bootstrap-tenant.nexusNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  user: admin
  password: {{ .Values.nexus.adminPassword | default .Values.password | quote }}
{{- if not .Values.nexus.lightwellNetwork.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: redhat-packages-credentials
  namespace: {{ include "bootstrap-tenant.nexusNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
# Rendered empty when no Lightwell Network credentials are supplied, so the
# tenant still deploys end to end. nexus-reconcile then skips the authenticated
# proxy repos instead of failing. Fill this Secret in later and re-run the
# reconcile Job to create them (see README). The keys always exist so the
# secretKeyRef in reconcile-job.yaml resolves either way.
stringData:
  username: {{ .Values.nexus.lightwellNetwork.username | default "" | quote }}
  password: {{ .Values.nexus.lightwellNetwork.password | default "" | quote }}
{{- end }}
