apiVersion: v1
kind: Secret
metadata:
  name: nexus-admin-secret
  namespace: {{ include "bootstrap-tenant.nexusNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  user: admin
  password: {{ .Values.nexus.adminPassword | default .Values.password | quote }}
{{- if not .Values.nexus.lightwellNetwork.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: redhat-packages-credentials
  namespace: {{ include "bootstrap-tenant.nexusNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  username: {{ required "Set nexus.lightwellNetwork.username, existingSecret, or AgnosticV helm_values" .Values.nexus.lightwellNetwork.username | quote }}
  password: {{ required "Set nexus.lightwellNetwork.password, existingSecret, or AgnosticV helm_values" .Values.nexus.lightwellNetwork.password | quote }}
{{- end }}
