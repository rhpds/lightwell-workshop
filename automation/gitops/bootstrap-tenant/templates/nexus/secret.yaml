apiVersion: v1
kind: Secret
metadata:
  name: nexus-admin-secret
  namespace: {{ include "bootstrap-tenant.nexusNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  user: admin
  password: {{ .Values.nexus.adminPassword | default .Values.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: redhat-packages-credentials
  namespace: {{ include "bootstrap-tenant.nexusNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  username: {{ .Values.nexus.lightwellNetwork.username | quote }}
  password: {{ .Values.nexus.lightwellNetwork.password | quote }}
