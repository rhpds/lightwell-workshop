apiVersion: batch/v1
kind: Job
metadata:
  name: nexus-reconcile
  namespace: {{ include "bootstrap-tenant.nexusNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: reconcile
          image: python:3.12-alpine
          command: ["python3", "/scripts/nexus-reconcile.py"]
          env:
            - name: NEXUS_URL
              value: "http://nexus:8081"
            - name: NEXUS_USER
              value: admin
            - name: NEXUS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexus-admin-secret
                  key: password
            # optional: an operator may point existingSecret at a Secret that
            # does not exist yet. Without this the pod sticks in
            # CreateContainerConfigError instead of running in degraded mode.
            - name: LIGHTWELL_NETWORK_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "bootstrap-tenant.lightwellNetworkSecretName" . }}
                  key: username
                  optional: true
            - name: LIGHTWELL_NETWORK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "bootstrap-tenant.lightwellNetworkSecretName" . }}
                  key: password
                  optional: true
            - name: NEXUS_WEBHOOK_REPOSITORIES
              valueFrom:
                configMapKeyRef:
                  name: tenant-integration
                  key: NEXUS_WEBHOOK_REPOSITORIES
            - name: SDLC_DRIVE
              value: {{ include "bootstrap-tenant.drive" . | quote }}
            - name: EDA_WEBHOOK_URL
              value: {{ include "bootstrap-tenant.edaWebhookUrl" . | quote }}
            # Fallback when Nexus rejects the in-cluster URL (see nexus-reconcile.py).
            - name: EDA_WEBHOOK_ROUTE_URL
              value: {{ include "bootstrap-tenant.edaWebhookRouteUrl" . | quote }}
            - name: INTAKE_WEBHOOK_URL
              value: {{ include "bootstrap-tenant.intakeWebhookUrl" . | quote }}
            - name: INTAKE_WEBHOOK_ROUTE_URL
              value: {{ include "bootstrap-tenant.intakeWebhookRouteUrl" . | quote }}
            - name: SKIP_WEBHOOK_SETUP
              valueFrom:
                configMapKeyRef:
                  name: tenant-integration
                  key: SKIP_WEBHOOK_SETUP
            - name: NEXUS_REPOSITORIES_FILE
              value: /config/lightwell-repositories.json
            - name: NEXUS_OCI_REPO_NAME
              value: {{ .Values.nexus.oci.repoName | default "oci" | quote }}
            - name: NEXUS_OCI_PORT
              value: {{ .Values.nexus.oci.port | default 5000 | quote }}
          volumeMounts:
            - mountPath: /config
              name: repos-config
              readOnly: true
            - mountPath: /scripts
              name: scripts
              readOnly: true
      volumes:
        - name: repos-config
          configMap:
            name: lightwell-repositories
        - name: scripts
          configMap:
            name: nexus-reconcile-source
            defaultMode: 0555
