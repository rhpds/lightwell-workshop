apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus
  namespace: {{ include "bootstrap-tenant.nexusNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:openshift:scc:anyuid-nexus-{{ .Values.guid }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: nexus
    namespace: {{ include "bootstrap-tenant.nexusNamespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
