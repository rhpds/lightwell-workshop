apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.username }}-edit
  namespace: {{ .Values.username }}-app
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: {{ .Values.username }}
{{- if .Values.sdlc.enabled }}
---
# The agent and its verification Jobs run outside the tenant's own
# namespaces, so without these the attendee cannot see them in the console at
# all -- the namespaces simply do not appear in the project list. `view` and
# not `edit`: sdlc-<guid> holds the GitLab PAT and the model API key, and
# `view` excludes secrets. Nothing in the lab asks the attendee to change
# anything here; they drive the agent through the OpenCode UI and GitLab.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.username }}-view
  namespace: {{ include "bootstrap-tenant.sdlcNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: {{ .Values.username }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.username }}-view
  namespace: {{ include "bootstrap-tenant.sandboxNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: {{ .Values.username }}
{{- end }}
