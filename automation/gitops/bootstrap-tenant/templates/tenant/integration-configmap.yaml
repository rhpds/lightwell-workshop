apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-integration
  namespace: {{ include "bootstrap-tenant.jobNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  GUID: {{ .Values.guid | quote }}
  KEYCLOAK_URL: {{ include "bootstrap-tenant.keycloakUrl" . | quote }}
  KEYCLOAK_TPA_REALM: {{ .Values.keycloak.tpaRealm | quote }}
  TPA_URL: {{ include "bootstrap-tenant.tpaUrl" . | quote }}
  TPA_TRUSTIFY_URL: {{ include "bootstrap-tenant.tpaUrl" . | quote }}
  TPA_OAUTH_CLIENT_ID: {{ .Values.tpa.uiClientId | quote }}
  TPA_UPLOADER_USERNAME: {{ .Values.tpa.uploaderUsername | default (printf "lightwell-uploader-%s" .Values.guid) | quote }}
  TPA_SBOM_LABEL: {{ include "bootstrap-tenant.tpaSbomLabel" . | quote }}
  GITLAB_URL: {{ include "bootstrap-tenant.gitlabHost" . | quote }}
  REMEDIATION_APP_GITLAB_PATH: {{ include "bootstrap-tenant.demoProjectPath" . | quote }}
  NEXUS_NAMESPACE: {{ include "bootstrap-tenant.nexusNamespace" . | quote }}
  NEXUS_WEBHOOK_REPOSITORIES: {{ printf "%s,%s" (include "bootstrap-tenant.nexusRepoValidated" .) (include "bootstrap-tenant.nexusRepoRemediated" .) | quote }}
  EDA_WEBHOOK_URL: {{ include "bootstrap-tenant.edaWebhookUrl" . | quote }}
  EDA_WEBHOOK_ROUTE_URL: {{ include "bootstrap-tenant.edaWebhookRouteUrl" . | quote }}
  GITLAB_WEBHOOK_TARGET_URL: {{ include "bootstrap-tenant.gitlabWebhookTargetUrl" . | quote }}
  AAP_CONTROLLER_URL: {{ include "bootstrap-tenant.aapControllerUrl" . | quote }}
  SDLC_NAMESPACE: {{ include "bootstrap-tenant.sdlcNamespace" . | quote }}
  SDLC_SANDBOX_NAMESPACE: {{ include "bootstrap-tenant.sandboxNamespace" . | quote }}
  EPHEMERAL_NS_PREFIX: {{ include "bootstrap-tenant.ephemeralNsPrefix" . | quote }}
  EDA_PROJECT_NAME: {{ include "bootstrap-tenant.edaProjectName" . | quote }}
  EDA_PROJECT_SCM_URL: {{ .Values.sdlc.scmUrl | quote }}
{{- if .Values.sdlc.ao.baseUrl }}
{{- if not (and .Values.sdlc.ao.clientId .Values.sdlc.ao.clientSecret .Values.sdlc.ao.startWebhookPath .Values.sdlc.ao.resumeWebhookPath) }}
{{- fail "sdlc.ao.baseUrl is set, so sdlc.ao.clientId, clientSecret, startWebhookPath and resumeWebhookPath are all required — the orchestrator playbooks assert on them" }}
{{- end }}
{{- end }}
  EDA_RULEBOOK_NAME: {{ include "bootstrap-tenant.rulebookName" . | quote }}
  AO_BASE_URL: {{ .Values.sdlc.ao.baseUrl | quote }}
  AO_CLIENT_ID: {{ .Values.sdlc.ao.clientId | quote }}
  AO_START_WEBHOOK_PATH: {{ .Values.sdlc.ao.startWebhookPath | quote }}
  AO_RESUME_WEBHOOK_PATH: {{ .Values.sdlc.ao.resumeWebhookPath | quote }}
  EDA_ACTIVATION_NAME: {{ include "bootstrap-tenant.edaActivationName" . | quote }}
  EDA_DECISION_ENV_NAME: {{ .Values.sdlc.decisionEnvName | quote }}
  EDA_DECISION_ENV_IMAGE: {{ .Values.sdlc.decisionEnvImage | quote }}
  EDA_ORGANIZATION_NAME: {{ include "bootstrap-tenant.aapOrg" . | quote }}
  OPENCODE_BASE_URL: {{ include "bootstrap-tenant.opencodeBaseUrl" . | quote }}
  OPENCODE_SERVER_USERNAME: {{ .Values.sdlc.opencodeServerUsername | quote }}
  NEXUS_URL: {{ include "bootstrap-tenant.nexusRouteUrl" . | quote }}
  AAP_ORG: {{ include "bootstrap-tenant.aapOrg" . | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-integration
  namespace: {{ include "bootstrap-tenant.nexusNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  NEXUS_WEBHOOK_REPOSITORIES: {{ printf "%s,%s" (include "bootstrap-tenant.nexusRepoValidated" .) (include "bootstrap-tenant.nexusRepoRemediated" .) | quote }}
  EDA_WEBHOOK_URL: {{ include "bootstrap-tenant.edaWebhookUrl" . | quote }}
  SKIP_WEBHOOK_SETUP: {{ if .Values.sdlc.enabled }}"false"{{ else }}"true"{{ end }}
