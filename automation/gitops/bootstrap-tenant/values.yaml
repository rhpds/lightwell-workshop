guid: CHANGEME
username: user-CHANGEME
password: changeme

argocd:
  namespace: openshift-gitops

deployer:
  domain: apps.example.com
  storageClass: ocs-external-storagecluster-ceph-rbd-immediate

jobAnsibleImage: quay.io/agnosticd/ee-multicloud:chained-2026-08-05

aap:
  namespace: aap
  org: "" # default user-{guid} via template helper
  controllerUrl: "" # default https://aap-{namespace}.{deployer.domain}

gitlab:
  namespace: gitlab
  group: "" # default acme-{guid} — per-tenant GitLab group for isolation
  demoProjectPath: "" # default {group}/wire-transfer-svc — AI remediation target
  pat: "" # unused by OpenCode; sync-gitlab-pat copies the GitLab root PAT into Secret gitlab-root-pat
  defaultBranch: main
  appSeeds:
    # riskClass / riskRationale drive the "Acme Inc. Risk Class" row and the
    # Recommended Action in the remediation MR body. HIGH and CRITICAL mean the
    # MR says human review is required even when every automated check passes,
    # so keep this consistent with policy.approval below.
    - name: wire-transfer-svc
      sourceRepo: https://github.com/redhat-ads-tech/wire-transfer-svc.git
      sourceRef: main
      riskClass: HIGH
      riskRationale: Payment-critical / PCI-scoped system — requires human review
      # Injected as .lightwell/policy.json during seed (overrides upstream if present).
      policy:
        remediation_owner: ao
        approval: needs_approval
    - name: benefits-mgmt-app
      sourceRepo: https://github.com/redhat-ads-tech/benefits-mgmt-app.git
      sourceRef: main
      riskClass: LOW
      riskRationale: Internal HR application — no regulated data
      policy:
        remediation_owner: ao
        approval: auto_approve
    - name: report-generator-app
      sourceRepo: https://github.com/redhat-ads-tech/report-generator-app.git
      sourceRef: main
      riskClass: LOW
      riskRationale: Internal reporting tool — no regulated data
      policy:
        remediation_owner: renovate

keycloak:
  url: "" # default https://sso.{deployer.domain}
  realm: sso

tpa:
  # Set tpa.enabled=false to skip per-tenant TPA deployment entirely.
  enabled: true
  url: "" # default https://tpa-{guid}.{deployer.domain}
  # Set to true to enable RHDA (Red Hat Dependency Analytics) backend per tenant.
  # Adds ~1 CPU / 3Gi memory per tenant (RHDA backend, PostgreSQL, Redis).
  rhda:
    enabled: false
  chartVersion: "*"
  oidc:
    frontendClientId: tpa-frontend
    cliClientId: tpa-cli
  sbomLabel: "" # default sdlc-demo-{guid}
  postgresql:
    credentials:
      dbHost: tpa-postgresql
      dbName: tpadb
      dbUser: tpauser
      dbPassword: r3dh8t1!
      dbAdmin: postgres
      dbAdminPassword: adminr3dh8t1!
      dbPort: "5432"
    storage:
      size: 5Gi
    tuning:
      maxWalSize: "1GB"
      minWalSize: "128MB"
      walBuffers: "16MB"
      maintenanceWorkMem: "64MB"
      workMem: "2MB"
      sharedBuffers: "128MB"
      effectiveCacheSize: "512MB"
      maxConnections: 100
  objectBucketClaim:
    name: tpa-bucket-claim
    storageClassName: openshift-storage.noobaa.io
  datasets:
    cve:
      url: "https://github.com/redhat-ads-tech/lb1815-vuln-seed/raw/refs/heads/main/lb1815-cve.zip"
      label: "labels.importer=CVElist-v5"
    osv:
      url: "https://github.com/redhat-ads-tech/lb1815-vuln-seed/raw/refs/heads/main/lb1815-osv.zip"
      label: "labels.importer=GHSA-OSV"
  images:
    postgresql: registry.redhat.io/rhel10/postgresql-18
    dataset: registry.redhat.io/ubi9/ubi
    rhdaBackend: quay.io/tssc_demos/trustify-dependency-analytics:v3.1.0
    rhdaInitImage: registry.redhat.io/ubi9/openjdk-21-runtime:1.23
    redis: registry.redhat.io/rhel9/redis-7:latest

rhda:
  postgresql:
    storage: 1Gi
    database: trustify_da
    username: trustify_da
    password: "r3dh8t1!"
  redis:
    storage: 1Gi
  branding:
    displayName: "Red Hat Trusted Profile Analyzer"
    exploreTitle: "Open your Red Hat Trusted Profile Analyzer"
    exploreDescription: "Red Hat Trusted Profile Analyzer helps organizations manage SBOMs, vulnerability advisories, and VEX data."

# ServiceNow mock (snow-<guid>). Empty image → ConfigMap + UBI Python runtime
# (comment-capable, GitOps-native). Set snow.image to a published quay tag to
# skip ConfigMaps (e.g. quay.io/redhat-ads-tech/snow-mock:1.1.0).
snow:
  enabled: true
  image: ""
  runtimeImage: registry.access.redhat.com/ubi9/python-311:latest
  demoUserName: Demo User
  url: "" # default https://snow-mock-snow-<guid>.<deployer.domain>

resourceQuota:
  limits:
    cpu: "16"
    memory: 32Gi
  requests:
    cpu: "16"
    memory: 32Gi
    storage: 50Gi

limitRange:
  default:
    cpu: "2"
    memory: 8Gi
  defaultRequest:
    cpu: 250m
    memory: 256Mi

build:
  enabled: true
  webhookSecret: ""

nexus:
  image: sonatype/nexus3:3.96.4-ubi
  storageSize: 50Gi
  oci:
    port: 5000
    repoName: oci
  adminPassword: ""
  repoValidated: ""
  repoRemediated: ""
  lightwellNetwork:
    # Do not commit real credentials. Use one of:
    # - AgnosticV ocp4_workload_gitops_bootstrap_helm_values (vault-backed, not in git)
    # - nexus.lightwellNetwork.existingSecret + oc create secret (see bootstrap-tenant/README.md)
    username: ""
    password: ""
    existingSecret: "" # e.g. redhat-packages-credentials — chart skips creating that Secret

sdlc:
  enabled: true
  namespace: "" # default sdlc-{guid}; set sdlc-control-plane only for legacy single-tenant labs
  # Source for BOTH the EDA project (rulebooks/) and the Controller project
  # (playbooks/). AO rulebook + start/resume orchestrator playbooks live here.
  scmUrl: https://github.com/rhpds/lw-sdlc-opencode.git
  projectName: "" # default SDLC {guid}
  activationName: "" # default sdlc-remediation-{guid}
  decisionEnvName: "SDLC Decision Environment"
  decisionEnvImage: quay.io/ansible/ansible-rulebook:main
  # AO path (default): sdlc-remediation.yml — EDA bridges to Automation Orchestrator.
  # Pre-AO chain: set orchestrator.enabled=false (uses sdlc-remediation-legacy.yml)
  # or override rulebookName.
  rulebookName: "" # default from orchestrator.enabled
  edaWebhookUrl: "" # default http://{activation}.{aap.ns}.svc:5000/
  edaWebhookRouteUrl: "" # default https://{activation}-{aap.ns}.{ingress}/
  gitlabWebhookTargetUrl: "" # default same as edaWebhookRouteUrl
  exposeUi: true # Route to the OpenCode embedded web UI (agent transcripts); basic-auth protected
  # Must carry agent prompts that read SDLC_SANDBOX_NAMESPACE / EPHEMERAL_NS_PREFIX
  # from env; older images hardcode the shared sdlc-sandboxes namespace.
  # Empty → OpenShift integrated registry (bootstrap-infra BuildConfig → ImageStream):
  #   image-registry.openshift-image-registry.svc:5000/lightwell-images/sdlc-opencode:<tag>
  # Override with a full ref for external Quay / offline pins.
  opencodeImage: ""
  opencodeImageNamespace: lightwell-images
  opencodeImageName: sdlc-opencode
  opencodeImageTag: sha-6fe8264
  opencodeImagePullPolicy: IfNotPresent
  opencodeBaseUrl: "" # default http://opencode.{sdlc.ns}.svc:4096
  # OpenCode tool permission: ask | allow | deny, or a per-tool map.
  # Must be "allow" for the EDA-driven flow: the agent runs unattended, and
  # OpenCode's default of "ask" for bash parks it on a prompt forever.
  opencodePermission: allow
  opencodeServerUsername: opencode
  opencodeServerPassword: "" # default tenant password if empty
  # Automation Orchestrator — overall flow controller after Nexus→EDA filter.
  # Install AO on the shared AAP platform (bootstrap-infra); wire webhook paths + SA here.
  # https://docs.redhat.com/en/documentation/automation_orchestrator/2026.8/
  orchestrator:
    # Student goto: Automation Orchestrator owns the remediation canvas after
    # Nexus→EDA filter. Requires AO installed on the shared platform (see
    # bootstrap-infra README). Each tenant gets an isolated AO *project*
    # (lightwell-{guid}), local user, EDA SA, and guid-scoped webhook paths so
    # students do not see each other's workflows/executions.
    # Set enabled=false only for pre-AO / legacy EDA-owned chains.
    enabled: true # true → sdlc-remediation.yml (AO); false → sdlc-remediation-legacy.yml
    namespace: automation-orchestrator # AO install namespace (admin secret + route)
    # Empty → https://ao.<deployer.domain> (infra Route). No AgnosticV AO knobs needed.
    baseUrl: ""
    projectName: "" # default lightwell-{guid}
    # Empty → lightwell-remediation-{start,resume}-{guid} (recommended for multi-tenant)
    startWebhookPath: ""
    resumeWebhookPath: ""
    clientId: "" # filled by ao-bootstrap Job into existingSecret (do not commit)
    clientSecret: "" # do not commit real values
    existingSecret: automation-orchestrator # keys: client_id, client_secret [, project_name]
  llm:
    # Shared RHDP MaaS gateway. AgnosticV overrides this with the per-tenant
    # endpoint the litellm_virtual_keys role exports. `model` is the switch
    # that turns LLM wiring on, not this — a default baseUrl alone must not
    # make the chart demand a model and key.
    baseUrl: https://maas-rhdp.apps.maas.redhatworkshops.io/v1
    model: "" # model ID exposed by LiteLLM; used as litellm/{model}
    apiKey: "" # when set, chart creates secret opencode-llm (optional for demos)
    existingSecret: "" # e.g. opencode-llm — chart skips creating that Secret; still wires OPENAI_API_KEY
  renovate:
    # Deterministic (non-AI) remediation via Renovate. Requires the Renovate
    # operator installed at cluster level (bootstrap-infra). Deploys the SA +
    # SCC + secret so the student can create a RenovateJob CR on demand from
    # the Showroom lab guide.
    enabled: true
  dashboard:
    # Off by default. The dashboard ships a credential-sync hook at sync-wave 3
    # that polls 10 minutes for the Lightwell Network Secret and then fails,
    # blocking waves 4-5 (eda-bootstrap, nexus-reconcile) and failing the whole
    # tenant sync. Enable only once nexus.lightwellNetwork is populated.
    enabled: false
    image: quay.io/bluesman/lightwell-demo-dashboard:v0.5.3
    imagePullPolicy: IfNotPresent
    aapUser: admin
    lightwell:
      url: https://packages.redhat.com/lightwell/java/remediated/

# Acme sample app deployment (ArgoCD app-of-apps → user-{guid}-app namespace)
apps:
  enabled: true
  imageTag: latest
  repoURL: https://github.com/redhat-ads-tech/acme-deployment.git
