guid: CHANGEME
username: user-CHANGEME
password: changeme

deployer:
  domain: apps.example.com
  storageClass: ocs-external-storagecluster-ceph-rbd-immediate

jobAnsibleImage: quay.io/agnosticd/ee-multicloud:chained-2026-08-05

aap:
  namespace: aap
  org: "" # default user-{guid} via template helper
  controllerUrl: "" # default https://aap-{namespace}.{deployer.domain}

gitlab:
  namespace: gitlab
  group: lightwell
  demoProjectPath: "" # default lightwell/lw-demo-help-app-{guid}
  pat: "" # optional; OpenCode uses password when unset

keycloak:
  url: "" # default https://sso.{deployer.domain}
  tpaRealm: trusted-profile-analyzer

tpa:
  namespace: lightwell-tpa
  url: "" # default https://server-{tpa.namespace}.{deployer.domain}
  uiClientId: trustify-ui
  uploaderUsername: "" # default lightwell-uploader-{guid}
  sbomLabel: "" # default sdlc-demo-{guid}
  adminUsername: admin # Keycloak realm user for platform admin (AAP/GitLab admin password)
  adminPassword: "" # default tenant password; set to bootstrap-infra admin.password if different

nexus:
  image: sonatype/nexus3:3.76.1
  storageSize: 20Gi
  adminPassword: ""
  repoValidated: ""
  repoRemediated: ""
  lightwellNetwork:
    username: CHANGE_ME
    password: CHANGE_ME

sdlc:
  enabled: true
  namespace: "" # default sdlc-{guid}; set sdlc-control-plane only for legacy single-tenant labs
  scmUrl: https://github.com/sshaaf/lw-sdlc-opencode.git # must contain rulebooks/ for EDA import
  projectName: "" # default SDLC {guid}
  activationName: "" # default sdlc-remediation-{guid}
  decisionEnvName: "SDLC Decision Environment"
  decisionEnvImage: quay.io/ansible/ansible-rulebook:main
  rulebookName: sdlc-remediation.yml
  edaWebhookUrl: "" # default http://{activation}.{aap.ns}.svc:5000/
  edaWebhookRouteUrl: "" # default https://{activation}-{aap.ns}.{ingress}/
  gitlabWebhookTargetUrl: "" # default same as edaWebhookRouteUrl
  opencodeImage: quay.io/sshaaf/sdlc-opencode:sha-59ffb92
  opencodeBaseUrl: "" # default http://opencode.{sdlc.ns}.svc:4096
  opencodeServerUsername: opencode
  opencodeServerPassword: "" # default tenant password if empty
  llm:
    apiKey: "" # when set, chart creates secret opencode-llm (optional for demos)
