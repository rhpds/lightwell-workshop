{{- if .Values.orchestrator.enabled }}
# CNPG app-user secrets (kubernetes.io/basic-auth) + AO credential Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: orchestrator-postgres-secret
  namespace: {{ .Values.orchestrator.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: kubernetes.io/basic-auth
stringData:
  username: orchestrator
  password: {{ .Values.admin.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: temporal-postgres-secret
  namespace: {{ .Values.orchestrator.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: kubernetes.io/basic-auth
stringData:
  username: temporal
  password: {{ .Values.admin.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: orchestrator-pg-credentials
  namespace: {{ .Values.orchestrator.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  database: orchestrator
  username: orchestrator
  password: {{ .Values.admin.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: temporal-pg-credentials
  namespace: {{ .Values.orchestrator.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  database: temporal
  username: temporal
  password: {{ .Values.admin.password | quote }}
{{- end }}
