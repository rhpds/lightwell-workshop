# App-of-apps for the Lightwell cluster platform.
# AgnosticV injects deployer.domain, admin.password, and storageClass at deploy time.
# Values here are passed down to child Applications via helm.valuesObject.

gitops:
  repoURL: https://github.com/rhpds/lightwell-workshop.git
  targetRevision: main

argocd:
  namespace: openshift-gitops

# OLM catalog snapshots for operator version pinning on OCP 5.
# Operators not yet in the v5.0 catalog fall back to v4.22 snapshots.
catalogSources:
  - name: redhat-operators-snapshot-v5
    image: quay.io/rhpds/olm_snapshot_redhat_catalog
    tag: v5.0_2026_11_16
    namespace: openshift-marketplace
    displayName: "Red Hat Operators v5.0 (Snapshot)"
    publisher: "Red Hat Demo Platform"
  - name: redhat-operators-snapshot-v4
    image: quay.io/rhpds/olm_snapshot_redhat_catalog
    tag: v4.22_2026_11_16
    namespace: openshift-marketplace
    displayName: "Red Hat Operators v4.22 (Snapshot)"
    publisher: "Red Hat Demo Platform"
  - name: certified-operators-snapshot-v4
    image: quay.io/rhpds/olm_snapshot_certified_catalog
    tag: v4.22_2026_11_16
    namespace: openshift-marketplace
    displayName: "Certified Operators v4.22 (Snapshot)"
    publisher: "Red Hat Demo Platform"

# Storage class for chart PVCs. Takes precedence over deployer.storageClass:
# core_workloads ocp4_workload_gitops_bootstrap shallow-merges its own
# deployer block over the helm values, which drops deployer.storageClass.
# Leave empty to fall back to deployer.storageClass (the CNV default).
storageClass: ""

deployer:
  domain: apps.example.com
  storageClass: ocs-external-storagecluster-ceph-rbd-immediate

admin:
  password: changeme

gitlab:
  namespace: gitlab
  image: quay.io/redhat-gpte/gitlab:17.4.1
  postgresqlImage: quay.io/redhat-gpte/gitlab-postgresql:14
  redisImage: redis:6.2.6
  rootPassword: changeme
  repos: []

aap:
  namespace: aap
  channel: stable-2.7
  source: redhat-operators-snapshot-v5
  manifestUrl: https://d3s3zqyaz8cp2d.cloudfront.net/aap/manifest.zip

orchestrator:
  enabled: true
  namespace: automation-orchestrator
  channel: stable
  source: redhat-operators-snapshot-v4
  postgres:
    instances: 1
    image: ghcr.io/cloudnative-pg/postgresql:15
    storageSize: 20Gi
    sslMode: require

cnpg:
  namespace: cloudnative-pg
  channel: stable-v1
  source: certified-operators-snapshot-v4

# NooBaa object storage. Required on clusters without ODF (AWS pools):
# the tenant TPA chart expects the openshift-storage.noobaa.io OBC
# storage class and the s3-openshift-storage.<domain> route.
# Leave disabled on CNV pools, which already provide NooBaa via external ODF.
noobaa:
  enabled: false
  name: noobaa
  namespace: openshift-storage
  channel: stable-4.22
  source: redhat-operators-snapshot-v5
  backingStore:
    storageClass: ocs-external-storagecluster-ceph-rbd

tpa:
  keycloak:
    realm: sso
    frontendClientId: tpa-frontend
    cliClientId: tpa-cli

rhtas:
  namespace: trusted-artifact-signer
  channel: stable-v1.4
  source: redhat-operators-snapshot-v5
  instance: securesign
  oidc:
    clientId: trusted-artifact-signer
  rootCert:
    commonName: CISO-office
    email: lightwell@redhat.com
    org: RedHat
  keycloak:
    namespace: keycloak
    realm: sso
  syncwave:
    keycloakJob: "1"
    securesign: "2"

pipelines:
  channel: pipelines-1.24
  source: redhat-operators-snapshot-v5
  chains:
    audience: trusted-artifact-signer

opencodeImage:
  enabled: true
  namespace: lightwell-images
  name: sdlc-opencode
  gitUrl: https://github.com/rhpds/lw-sdlc-opencode.git
  gitRef: "7971cad"
  tag: sha-7971cad
  dockerfilePath: container/Dockerfile
  contextDir: ""

cliImage: registry.redhat.io/openshift5/ose-cli-rhel9:v5.0

jobAnsibleImage: quay.io/agnosticd/ee-multicloud:chained-2026-08-05

# Red Hat build of Agent Sandbox. AllNamespaces CSV, so the Subscription
# lives in openshift-operators. The v0.9.0 CRD has no failedPodPolicy.
agentSandbox:
  enabled: true
  name: agent-sandbox-operator
  channel: preview-0.9
  startingCSV: agent-sandbox-operator.v0.9.0
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  namespace: openshift-operators
  metrics:
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
      labels:
        release: kube-prometheus-stack

# Shared trace store for Sandbox agents. One Tempo + collector for the cluster.
# Tenants do not install this; Sandbox/opencode exports OTLP at the endpoint below.
lightwellObservability:
  enabled: true
  namespace: lightwell-observability
