# App-of-apps for the Lightwell cluster platform.
# AgnosticV injects deployer.domain, admin.password, and storageClass at deploy time.
# Values here are passed down to child Applications via helm.valuesObject.

gitops:
  repoURL: https://github.com/rhpds/lightwell-workshop.git
  targetRevision: main

argocd:
  namespace: openshift-gitops

deployer:
  domain: apps.example.com
  storageClass: ocs-external-storagecluster-ceph-rbd-immediate

admin:
  password: changeme

gitlab:
  namespace: gitlab
  image: quay.io/redhat-gpte/gitlab:17.4.1
  postgresqlImage: quay.io/redhat-gpte/gitlab-postgresql:14
  redisImage: redis:6.2.6
  rootPassword: changeme
  repos: []

aap:
  namespace: aap
  channel: stable-2.7
  manifestUrl: https://d3s3zqyaz8cp2d.cloudfront.net/aap/manifest.zip

orchestrator:
  enabled: true
  namespace: automation-orchestrator
  channel: stable
  postgres:
    instances: 1
    image: ghcr.io/cloudnative-pg/postgresql:15
    storageSize: 20Gi
    sslMode: require

cnpg:
  namespace: cloudnative-pg
  channel: stable-v1
  source: certified-operators

tpa:
  namespace: lightwell-tpa
  channel: stable-v1.1
  keycloakRealm: trusted-profile-analyzer
  uiClientId: trustify-ui
  storageSize: 20Gi
  dbStorageSize: 5Gi
  postgresImage: docker.io/library/postgres:16-alpine

rhtas:
  namespace: lightwell-tas
  channel: stable-v1.4

quay:
  namespace: lightwell-quay
  channel: stable-3.18

opencodeImage:
  enabled: true
  namespace: lightwell-images
  name: sdlc-opencode
  gitUrl: https://github.com/rhpds/lw-sdlc-opencode.git
  gitRef: "aad125a"
  tag: sha-aad125a
  dockerfilePath: container/Dockerfile
  contextDir: ""

jobAnsibleImage: quay.io/agnosticd/ee-multicloud:chained-2026-08-05
