apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: renovate-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: renovate-operator
    repoURL: ghcr.io/mogenius/helm-charts
    targetRevision: 6.4.0
    helm:
      releaseName: renovate-operator
      valuesObject:
        rbac:
          ownNamespaceOnly: false
        securityContext:
          pod:
            runAsUser: null
            runAsGroup: null
            fsGroup: null
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          container:
            runAsUser: null
            runAsGroup: null
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
            privileged: false
            allowPrivilegeEscalation: false
        crd:
          securityContext:
            pod:
              runAsUser: null
              runAsGroup: null
              fsGroup: null
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            container:
              runAsUser: null
              runAsGroup: null
              capabilities:
                drop:
                  - ALL
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
              readOnlyRootFilesystem: true
              privileged: false
              allowPrivilegeEscalation: false
  destination:
    server: https://kubernetes.default.svc
    namespace: renovate-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
