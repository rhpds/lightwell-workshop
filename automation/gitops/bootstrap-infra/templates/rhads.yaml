apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "app-of-apps.metadata" (dict "name" "rhads" "namespace" .Values.argocd.namespace "syncWave" "-1") }}
spec:
  destination:
    namespace: {{ .Values.rhtas.namespace }}
    server: https://kubernetes.default.svc
  project: default
  source:
    path: automation/gitops/cluster/rhads
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    helm:
      valuesObject:
        deployer:
          domain: {{ .Values.deployer.domain }}
          storageClass: {{ .Values.storageClass | default .Values.deployer.storageClass }}
        admin:
          password: {{ .Values.admin.password | quote }}
        tpa:
          keycloak:
            realm: {{ .Values.tpa.keycloak.realm }}
            frontendClientId: {{ .Values.tpa.keycloak.frontendClientId }}
            cliClientId: {{ .Values.tpa.keycloak.cliClientId }}
        rhtas:
          namespace: {{ .Values.rhtas.namespace }}
          channel: {{ .Values.rhtas.channel }}
          instance: {{ .Values.rhtas.instance }}
          oidc:
            clientId: {{ .Values.rhtas.oidc.clientId }}
          rootCert:
            commonName: {{ .Values.rhtas.rootCert.commonName }}
            email: {{ .Values.rhtas.rootCert.email }}
            org: {{ .Values.rhtas.rootCert.org }}
          keycloak:
            namespace: {{ .Values.rhtas.keycloak.namespace }}
            realm: {{ .Values.rhtas.keycloak.realm }}
          syncwave:
            keycloakJob: {{ .Values.rhtas.syncwave.keycloakJob | quote }}
            securesign: {{ .Values.rhtas.syncwave.securesign | quote }}
        pipelines:
          channel: {{ .Values.pipelines.channel }}
          chains:
            audience: {{ .Values.pipelines.chains.audience }}
        jobAnsibleImage: {{ .Values.jobAnsibleImage }}
{{ include "app-of-apps.syncPolicy" . | indent 2 }}
