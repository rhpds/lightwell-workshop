apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "app-of-apps.metadata" (dict "name" "catalog-sources" "namespace" .Values.argocd.namespace "syncWave" "-5") }}
spec:
  destination:
    namespace: openshift-marketplace
    server: https://kubernetes.default.svc
  project: default
  source:
    path: automation/gitops/cluster/catalog-sources
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    helm:
      valuesObject:
        catalogSources:
          {{- toYaml .Values.catalogSources | nindent 10 }}
{{ include "app-of-apps.syncPolicy" . | indent 2 }}
