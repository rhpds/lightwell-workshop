{{- if .Values.opencodeImage.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "app-of-apps.metadata" (dict "name" "opencode-image" "namespace" .Values.argocd.namespace "syncWave" "2") }}
spec:
  destination:
    namespace: {{ .Values.opencodeImage.namespace }}
    server: https://kubernetes.default.svc
  project: default
  source:
    path: automation/gitops/cluster/opencode-image
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    helm:
      valuesObject:
        opencodeImage:
          enabled: {{ .Values.opencodeImage.enabled }}
          namespace: {{ .Values.opencodeImage.namespace }}
          name: {{ .Values.opencodeImage.name }}
          gitUrl: {{ .Values.opencodeImage.gitUrl }}
          gitRef: {{ .Values.opencodeImage.gitRef | quote }}
          tag: {{ .Values.opencodeImage.tag }}
          dockerfilePath: {{ .Values.opencodeImage.dockerfilePath }}
          {{- if .Values.opencodeImage.contextDir }}
          contextDir: {{ .Values.opencodeImage.contextDir }}
          {{- end }}
        jobAnsibleImage: {{ .Values.jobAnsibleImage }}
{{ include "app-of-apps.syncPolicy" . | indent 2 }}
{{- end }}
