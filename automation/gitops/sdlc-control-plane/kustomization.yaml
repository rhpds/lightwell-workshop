apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sdlc-control-plane

resources:
  - namespace.yaml
  - ../base/cluster-config
  - deployment.yaml

replacements:
  - source:
      kind: ConfigMap
      name: sdlc-cluster-config
      fieldPath: data.OPENCODE_IMAGE
    targets:
      - select:
          kind: Deployment
          name: opencode
        fieldPaths:
          - spec.template.spec.containers.[name=opencode].image

patches:
  - target:
      kind: Deployment
      name: opencode
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: opencode-llm
              key: api_key
              optional: true
