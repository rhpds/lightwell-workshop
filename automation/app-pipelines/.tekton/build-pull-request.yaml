apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: build-pull-request
  annotations:
    # Runs on the MR branch while the merge request is open, so a remediation
    # is verified *before* anyone merges it. build-push-to-main only fires
    # after the fact.
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
spec:
  params:
    - name: repo-url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: maven-mirror-url
      value: "{{ maven-mirror-url }}"
    - name: mr-iid
      value: "{{ pull_request_number }}"
    - name: gitlab-api-url
      value: "{{ repo_url }}"
    - name: project-path
      value: "{{ repo_owner }}/{{ repo_name }}"
  pipelineSpec:
    params:
      - name: repo-url
      - name: revision
      - name: maven-mirror-url
      - name: mr-iid
      - name: gitlab-api-url
      - name: project-path
    tasks:
      - name: fetch-source
        taskRef:
          resolver: cluster
          params:
            - { name: kind, value: task }
            - { name: name, value: git-clone }
            - { name: namespace, value: openshift-pipelines }
        workspaces:
          - { name: output, workspace: source }
          - { name: basic-auth, workspace: git-credentials }
        params:
          - { name: URL, value: "$(params.repo-url)" }
          - { name: REVISION, value: "$(params.revision)" }

      # `verify` runs unit and integration tests and writes the surefire /
      # failsafe reports that report-validation parses. Allowed to fail so the
      # MR still gets a table saying what broke, instead of no table at all.
      - name: run-tests
        runAfter: [fetch-source]
        taskRef:
          resolver: cluster
          params:
            - { name: kind, value: task }
            - { name: name, value: maven }
            - { name: namespace, value: openshift-pipelines }
        workspaces:
          - { name: source, workspace: source }
          - { name: maven_settings, workspace: maven-settings }
        params:
          - { name: GOALS, value: ["verify", "--fail-never"] }
          - { name: MAVEN_MIRROR_URL, value: "$(params.maven-mirror-url)" }

      # Fills the Automated Validation table on the merge request opened by the
      # Lightwell remediation agent. Rewrites only the text between the
      # lw:validation / lw:action markers, so the Summary and Vulnerability
      # Details the agent wrote are preserved. A merge request that has no
      # markers (a human one, say) is left alone.
      - name: report-validation
        runAfter: [run-tests]
        taskSpec:
          params:
            - { name: MR_IID }
            - { name: GITLAB_API_URL }
            - { name: PROJECT_PATH }
          workspaces:
            - name: source
          steps:
            - name: report
              image: registry.access.redhat.com/ubi9/python-39:latest
              workingDir: $(workspaces.source.path)
              env:
                # Same secret PaC already uses for this repo; the build-setup
                # Job puts the GitLab root PAT here. No extra plumbing needed.
                - name: GITLAB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: gitlab-pac-token
                      key: token
              script: |
                #!/usr/bin/env python3
                """Parse surefire/failsafe reports and update the MR table."""
                import glob, json, os, ssl, sys, urllib.parse, urllib.request
                import xml.etree.ElementTree as ET

                iid = "$(params.MR_IID)"
                base = "$(params.GITLAB_API_URL)".split("/")[0:3]
                api = "/".join(base) + "/api/v4"
                proj = urllib.parse.quote("$(params.PROJECT_PATH)", safe="")
                tok = os.environ.get("GITLAB_TOKEN", "")
                if not tok:
                    sys.exit("ERROR: gitlab-pac-token secret is empty; cannot update the MR")

                ctx = ssl.create_default_context()
                ctx.check_hostname = False
                ctx.verify_mode = ssl.CERT_NONE

                def call(method, path, body=None):
                    r = urllib.request.Request(
                        api + path, method=method,
                        data=json.dumps(body).encode() if body else None)
                    r.add_header("PRIVATE-TOKEN", tok)
                    r.add_header("Content-Type", "application/json")
                    with urllib.request.urlopen(r, context=ctx) as f:
                        return json.loads(f.read().decode() or "{}")

                def tally(pattern):
                    """Sum tests/failures/errors/skipped across report XMLs."""
                    t = f = e = s = 0
                    found = False
                    for p in glob.glob(pattern, recursive=True):
                        try:
                            root = ET.parse(p).getroot()
                        except ET.ParseError:
                            continue
                        found = True
                        t += int(root.get("tests", 0))
                        f += int(root.get("failures", 0))
                        e += int(root.get("errors", 0))
                        s += int(root.get("skipped", 0))
                    return (t, f, e, s) if found else None

                unit = tally("**/target/surefire-reports/TEST-*.xml")
                integ = tally("**/target/failsafe-reports/TEST-*.xml")

                def row(res, label):
                    if res is None:
                        return None  # not run — leave Pending rather than guess
                    t, f, e, s = res
                    bad = f + e
                    return {
                        "status": "passed" if bad == 0 else "failed",
                        "details": f"{t - bad}/{t} {label} passed ({f} failures, {e} errors, {s} skipped)",
                    }

                results = {}
                for key, res, label in (("unit_tests", unit, "tests"),
                                        ("integration_tests", integ, "tests")):
                    r = row(res, label)
                    if r:
                        results[key] = r
                # The build itself is the compatibility signal: Maven resolved
                # the bumped dependency and compiled every call site against it.
                if unit is not None or integ is not None:
                    results["dependency_compat"] = {
                        "status": "passed",
                        "details": "Project compiles and resolves against the remediated version",
                    }
                print("results:", json.dumps(results, indent=2))

                mr = call("GET", f"/projects/{proj}/merge_requests/{iid}")
                # AO merges auto_approve apps as soon as its in-loop Verifier
                # returns (ADR-025/026), which can happen while this pipeline
                # is still running mvn. Writing a validation table onto an
                # already-merged MR is noise, so stop.
                if mr.get("state") != "opened":
                    print(f"MR !{iid} is {mr.get('state')}; nothing to update.")
                    sys.exit(0)
                desc = mr.get("description") or ""
                VS, VE = "<!-- lw:validation:start -->", "<!-- lw:validation:end -->"
                AS_, AE = "<!-- lw:action:start -->", "<!-- lw:action:end -->"
                if VS not in desc:
                    print("MR has no Lightwell validation block; nothing to update.")
                    sys.exit(0)

                CHECKS = [("risk_class", "Acme Inc. Risk Class"),
                          ("signature", "Binary signature verification"),
                          ("sbom_integrity", "SBOM integrity"),
                          ("unit_tests", "Unit tests"),
                          ("integration_tests", "Integration tests"),
                          ("dependency_compat", "Dependency compatibility"),
                          ("regression", "Regression scan"),
                          ("license", "License compliance")]
                ICON = {"passed": "✅ Passed", "failed": "❌ Failed",
                        "pending": "⏳ Pending", "skipped": "⏭️ Skipped"}

                # Keep the existing risk row: it came from the chart, not from us.
                risk_row = next((l for l in desc.splitlines()
                                 if l.startswith("| Acme Inc. Risk Class |")), None)
                risk_class = ""
                if risk_row:
                    cells = [c.strip() for c in risk_row.split("|")]
                    if len(cells) >= 3:
                        risk_class = cells[2].split()[-1]

                rows = ["| Check | Status | Details |", "|---|---|---|"]
                for key, label in CHECKS:
                    if key == "risk_class":
                        rows.append(risk_row or f"| {label} | ⚪ NONE | No risk classification recorded |")
                        continue
                    r = results.get(key) or {}
                    rows.append(f"| {label} | {ICON.get(r.get('status'), ICON['pending'])} | "
                                f"{r.get('details') or 'Awaiting verification'} |")

                failed = [lab for k, lab in CHECKS
                          if (results.get(k) or {}).get("status") == "failed"]
                if failed:
                    action = ("> ❌ **Do not merge — automated validation failed.**\n>\n"
                              f"> Failing checks: {', '.join(failed)}.")
                elif risk_class in ("HIGH", "CRITICAL"):
                    action = ("> 🔍 **Requires human review before merge.**\n>\n"
                              "> A security or DevSecOps engineer should review the patch diff. "
                              f"Risk class **{risk_class}** requires review regardless of automated results.")
                else:
                    action = ("> ✅ **Safe to merge.**\n>\n"
                              "> All automated checks passed and the application is not in a "
                              "review-required risk class.")

                def splice(text, start, end, body):
                    a, b = text.find(start), text.find(end)
                    if a == -1 or b == -1 or b < a:
                        return text
                    return text[:a + len(start)] + "\n" + body + "\n" + text[b:]

                desc = splice(desc, VS, VE, "\n".join(rows))
                desc = splice(desc, AS_, AE, action)
                call("PUT", f"/projects/{proj}/merge_requests/{iid}", {"description": desc})
                print(f"Updated MR !{iid}: {sorted(results)}")
        workspaces:
          - { name: source, workspace: source }
        params:
          - { name: MR_IID, value: "$(params.mr-iid)" }
          - { name: GITLAB_API_URL, value: "$(params.gitlab-api-url)" }
          - { name: PROJECT_PATH, value: "$(params.project-path)" }
    workspaces:
      - name: source
      - name: git-credentials
      - name: maven-settings
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 2Gi } }
    - name: git-credentials
      secret:
        secretName: "{{ git_auth_secret }}"
    - name: maven-settings
      emptyDir: {}
