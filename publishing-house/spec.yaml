project:
  slug: "lightwell-workshop"
  owner_email: "nvinto@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "classic"
  intake_type: "new"
  automation_type: "gitops"
  description: "See how Lightwell transforms open source vulnerability remediation from a weeks-long manual process into an automated operation using AAP, TPA, TSF and RHAI."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-1247"
  workflow_id: "5be45dfe-5576-468e-bcb2-341444d1a302"

spec:
  title: "Get Ready for Lightwell: Patch to Production at the Speed of AI"
  learning_objectives: []
  modules:
  - id: module-01
    title: "Patch Ingestion — From Lightwell to Artifactory to Ansible"
    duration_min: 20
    status: not_started
  - id: module-02
    title: "Vulnerability Analysis with Trusted Profile Analyzer"
    duration_min: 20
    status: not_started
  - id: module-03
    title: "AI-Assisted Remediation — Reviewing and Approving Patches"
    duration_min: 25
    status: not_started
  - id: module-04
    title: "Build, Deploy, and Close the Loop"
    duration_min: 25
    status: not_started
  environment:
    platform: "ocp"
    topology: "shared-cluster"
    cloud_provider: cnv
    max_concurrent_users: 20

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: "4.20"
    cluster_type: "multinode"
    control_plane_instance_count: 3
    control_plane_cpu: 16
    control_plane_ram_gb: 64
    worker_count: 6
    worker_cpu: 16
    worker_ram_gb: 64
    worker_disk_gb: 200

    # --- VM-specific fields (only when platform = rhel-vms) ---
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: "latest GA"
    ai_requirement: "maas"
    ai_model_tier: "open-source"
    ai_model_name: "Opus-tier equivalent open-source model via LangChain Deep Agent harness"
    ai_justification: ""
    non_ga_products: []
    non_ga_access_plan: ""
    external_services:
      - "Lightwell Network (patch delivery)"
      - "ServiceNow sandbox"
      - "quay.io"
      - "registry.access.redhat.com"
    gpu_nodes: 0
    gpu_type: ""
  duration_hours: 1.5
  audience: "intermediate"

development:
