# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: ""
    catalog_gap: "No existing catalog item covers Red Hat Lightwell as the orchestrating agent for automated patch remediation, nor the Artifactory-triggered Event-Driven Ansible pipeline that drives the workflow. Existing labs treat TPA, RHACM, GitOps, and AAP as separate topics; this lab is the first to unify them into a single end-to-end CVE-to-deploy pipeline with AI-generated merge requests and automated ticket closure."
    design_overview: "This lab puts platform engineers in the role of Dinesh, a security operations engineer at a fictional financial services company, experiencing how Red Hat Lightwell automates open source vulnerability remediation end-to-end. Lightwell patches are ingested via JFrog Artifactory, triggering an Event-Driven Ansible pipeline that drives CVE analysis through Trusted Profile Analyzer, AI-assisted merge requests from the Lightwell Deep Agent on OpenShift AI, container build and signing via Trusted Software Factory, and multi-cluster deployment through RHACM and OpenShift GitOps. In 90 minutes, participants work through the complete patch-to-production workflow and observe automated ServiceNow ticket closure."
    module_summaries:
      - title: "Patch Ingestion — From Lightwell to Artifactory to Ansible"
        overview: "Participants orient to the Lightwell dashboard, review what was auto-processed overnight versus flagged for expert review, and trace how a patch delivery into JFrog Artifactory triggered the Event-Driven Ansible workflow."
      - title: "Vulnerability Analysis with Trusted Profile Analyzer"
        overview: "Participants use Red Hat Trusted Profile Analyzer to investigate the blast radius of a flagged CVE, examine SBOM lineage to identify impacted components, and interpret business risk context before the patch proceeds to AI-assisted remediation."
      - title: "AI-Assisted Remediation — Reviewing and Approving Patches"
        overview: "Participants review risk assessments and merge requests generated by the Lightwell Deep Agent on OpenShift AI, inspect diffs in GitLab, and approve patches to advance through the build pipeline."
      - title: "Build, Deploy, and Close the Loop"
        overview: "Participants observe the Trusted Software Factory build and image-signing pipeline, watch RHACM and OpenShift GitOps deploy the patched image across the multi-cluster fleet, and verify that TPA clears the CVE and ServiceNow auto-closes the related ticket."
    rcars_overlap_pct: 76
    rcars_top_matches:
      - title: "Product Enablement: Red Hat Advanced Developer Suite (TL3)"
        ci_name: "pert.redhat-rhads.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=pert.redhat-rhads.prod"
        relevance_score: 76
        why_it_fits: "Covers TPA, OpenShift GitOps/ArgoCD, and software supply chain security workflows central to this scenario; platform engineers gain hands-on depth in TPA vulnerability management and GitOps-driven deployment patterns."
        workloads:
          - role: "ocp4_workload_cert_manager"
            collection: "agnosticd.core_workloads"
          - role: "ocp4_workload_external_odf"
            collection: "agnosticd.core_workloads"
      - title: "Product Enablement: Red Hat Advanced Developer Suite on RHEL (TL3)"
        ci_name: "openshift-cnv.rhads-rhel-lab.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=openshift-cnv.rhads-rhel-lab.prod"
        relevance_score: 62
        why_it_fits: "Covers TPA and AAP including CVE/vulnerability analysis via SBOM ingestion into TPA — directly relevant to the analyze-CVE objective."
        workloads: []
      - title: "Hands-on lab with Red Hat OpenShift Platform Plus (2025)"
        ci_name: "sandboxes-gpte.opp-hol.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=sandboxes-gpte.opp-hol.prod"
        relevance_score: 58
        why_it_fits: "Covers RHACM multi-cluster management, OpenShift GitOps/ArgoCD, and vulnerability management workflows aligning with the fleet deployment and CVE remediation themes."
        workloads: []
    catalog_gap: "No existing catalog item covers Red Hat Lightwell as the orchestrating agent for automated patch remediation, nor the Artifactory-triggered Event-Driven Ansible pipeline that drives the workflow. Existing labs treat TPA, RHACM, GitOps, and AAP as separate topics; this lab is the first to unify them into a single end-to-end CVE-to-deploy pipeline with AI-generated merge requests and automated ticket closure."
    rejections: []

