  owner_email: nvinto@redhat.com
  content_type: lab
  deployment_mode: rhdp_published
  initiative_key: rh1_2027
  showroom_type: classic
  intake_type: new
  automation_type: gitops
  description: See how Lightwell transforms open source vulnerability remediation
    from a weeks-long manual process into an automated operation using AAP, TPA, TSF
    and RHAI.
  jira_ticket: RHDPCD-1247
  workflow_id: 5be45dfe-5576-468e-bcb2-341444d1a302
spec:
  title: 'Get Ready for Lightwell: Patch to Production at the Speed of AI'
  learning_objectives:
  - Explore the Lightwell dashboard to interpret automated patch assessments and identify
    items requiring manual review
  - Analyze CVE impact scope using Red Hat Trusted Profile Analyzer and SBOM data
    to assess business risk
  - Evaluate and approve AI-generated merge requests produced by the Lightwell Deep
    Agent
  - Observe a patch moving through the Trusted Software Factory build, sign, and verify
    pipeline
  - Deploy patched container images across a multi-cluster fleet using Red Hat Advanced
    Cluster Management and OpenShift GitOps
  - Verify end-to-end remediation closure, including automated ServiceNow ticket resolution
  modules:
  - id: module-00
    title: "CVEs, SBOMs, and the Patch Workflow \u2014 Foundations"
    duration_min: 5
    status: not_started
  - id: module-01
    title: "Patch Ingestion \u2014 From Lightwell to Artifactory to Ansible"
    duration_min: 25
    status: not_started
  - id: module-02
    title: "Vulnerability Analysis with Trusted Profile Analyzer"
    duration_min: 30
    status: not_started
  - id: module-03
    title: "AI-Assisted Remediation \u2014 Reviewing and Approving Patches"
    duration_min: 30
    status: not_started
  - id: module-04
    title: "Build, Deploy, and Close the Loop"
    duration_min: 30
    status: not_started
