approval_checklist:
  content:
    prerequisites_verifiable: false
    assessment_strategy: ''
    catalog_gap: No existing catalog item covers Red Hat Lightwell as the orchestrating
      agent for automated patch remediation, nor the Artifactory-triggered Event-Driven
      Ansible pipeline that drives the workflow. Existing labs treat TPA, RHACM, GitOps,
      and AAP as separate topics; this lab is the first to unify them into a single
      end-to-end CVE-to-deploy pipeline with AI-generated merge requests and automated
      ticket closure.
    design_overview: This lab puts platform engineers in the role of Dinesh, a security
      operations engineer at a fictional financial services company, experiencing
      how Red Hat Lightwell automates open source vulnerability remediation end-to-end.
      Lightwell patches are ingested via JFrog Artifactory, triggering an Event-Driven
      Ansible pipeline that drives CVE analysis through Trusted Profile Analyzer,
      AI-assisted merge requests from the Lightwell Deep Agent on OpenShift AI, container
      build and signing via Trusted Software Factory, and multi-cluster deployment
      through RHACM and OpenShift GitOps. In 90 minutes, participants work through
      the complete patch-to-production workflow and observe automated ServiceNow ticket
      closure.
    module_summaries:
    - title: "CVEs, SBOMs, and the Patch Workflow \u2014 Foundations"
      overview: "A 5-minute orientation covering what CVEs are and how they are scored, what SBOMs are and how they enable precise impact analysis, and why traditional patch workflows take weeks \u2014 establishing the conceptual foundation before participants engage with Lightwell's automation."
    - title: "Patch Ingestion \u2014 From Lightwell to Artifactory to Ansible"
      overview: Participants orient to the Lightwell dashboard, review what was auto-processed
        overnight versus flagged for expert review, and trace how a patch delivery
        into JFrog Artifactory triggered the Event-Driven Ansible workflow.
    - title: Vulnerability Analysis with Trusted Profile Analyzer
      overview: Participants use Red Hat Trusted Profile Analyzer to investigate the
        blast radius of a flagged CVE, examine SBOM lineage to identify impacted components,
        and interpret business risk context before the patch proceeds to AI-assisted
        remediation.
    - title: "AI-Assisted Remediation \u2014 Reviewing and Approving Patches"
      overview: Participants review risk assessments and merge requests generated
        by the Lightwell Deep Agent on OpenShift AI, inspect diffs in GitLab, and
        approve patches to advance through the build pipeline.
    - title: Build, Deploy, and Close the Loop
      overview: Participants observe the Trusted Software Factory build and image-signing
        pipeline, watch RHACM and OpenShift GitOps deploy the patched image across
        the multi-cluster fleet, and verify that TPA clears the CVE and ServiceNow
        auto-closes the related ticket.
